name: Week 1 lab

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
        working-directory: labs/01-testing-foundations
      - run: pytest
        working-directory: labs/01-testing-foundations
